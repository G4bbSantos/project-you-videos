<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project 3*X</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Ícones do Lucide (leves e modernos) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <h1 class="logo">Project 3*X</h1>
      <nav class="nav">
        <ul class="nav-links">
          <li><a href="#"><i data-lucide="home"></i> Início</a></li>
          <li><a href="#"><i data-lucide="search"></i> Pesquisa</a></li>
          <li><a href="#"><i data-lucide="layers"></i> Categorias</a></li>
          <li><a href="#"><i data-lucide="user"></i> Perfil</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" id="menu-toggle">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>
  <main>
    <section id="favoritos-section" class="favoritos hidden">
      <h2>🎥 Meus Vídeos Favoritos</h2>
      <div class="video-grid" id="video-grid">
        <!-- Vídeos serão inseridos aqui via JS -->
      </div>
    </section>
    <section id="recomendados-section" class="recomendados hidden">
        <h2>🔥 Recomendados para Você</h2>
        <div class="video-grid" id="recomendados-grid">
          <!-- Vídeos serão inseridos aqui via JS -->
        </div>
    </section>      
  </main>
  
</body>

<script src="assets/js/script.js"></script>

</html>

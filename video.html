<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assistir Vídeo - Project 3*X</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <header class="header">
    <div class="header-container">
      <h1 class="logo">You Videos</h1>
      <nav class="nav">
        <ul class="nav-links">
          <li><a href="index.html"><i data-lucide="home"></i> Início</a></li>
          <li><a href="#"><i data-lucide="search"></i> Pesquisa</a></li>
          <li><a href="#"><i data-lucide="layers"></i> Categorias</a></li>
          <li><a href="#"><i data-lucide="user"></i> Perfil</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" id="menu-toggle">
        <i data-lucide="menu"></i>
      </button>
    </div>
  </header>

  <main class="video-page">
    <section class="video-player-container">
      <div class="video-wrapper" id="video-container">
        <!-- Player vai aqui via JS -->
      </div>
      <h2 id="video-title"></h2>
      <button id="add-fav" class="fav-button">⭐ Adicionar aos Favoritos</button>
    </section>

    <section class="comentarios">
      <h3>💬 Comentários</h3>
      <textarea placeholder="Escreva um comentário..."></textarea>
      <button class="comentar">Enviar</button>
      <div class="comentarios-lista">
        <p>Nenhum comentário ainda.</p>
      </div>
    </section>

    <section class="recomendados" id="recomendados-section">
      <h3>🔁 Recomendados</h3>
      <div class="video-grid" id="recomendados-grid">
        <!-- Recomendados por JS -->
      </div>
    </section>
  </main>

  <script src="assets/js/script.js"></script>
</body>
</html>
